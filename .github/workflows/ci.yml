# DiffractoKit CI: the gate (tools/test.sh = `swift test -c release`), the hook proof, the consumer check, the README consumer and the example.
#
# Modelled on SpectroKit's workflow. Enabling it (Actions on the repository) is the owner's. The package needs macOS 27 and a
# Swift 6.2 toolchain (Package.swift: `.macOS("27.0")`, tools 6.2): the runner image must carry an Xcode with the macOS 27 SDK.
# `macos-latest` is used, with the newest Xcode selected; if the image lags, pin `runs-on` to the first image that has it.
#
# THE PINS' PYTHON ORACLES ARE NOT RUN HERE. The tests read committed fixtures (Tests/*/Fixtures/*.json, generated by
# tools/*/pins.py against pymatgen 2026.9.24, pymatgen-core 2026.9.23, spglib 2.8.0, NumPy 2.5.4, SciPy 1.18.1 and py4DSTEM
# f050d207's table) and compare the kit with them. Regenerating a fixture needs the gitignored References/ (the pinned
# virtual environment and clones) on the owner's machine; the apps-parity dumps need mac4DSTEM and macTEM checked out
# beside this repository. CI therefore proves "the kit equals the committed pins", not "the pins equal the oracle".
#
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend); tools/test.sh is the gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Hook proof (no sleep or poll loops)
        run: tools/hooks/test-no-sleep-poll.sh
      - name: Gate (tools/test.sh, release)
        run: tools/test.sh
      - name: Consumer check (a separate package, the public API only)
        run: tools/consumer-check/run.sh
      - name: README consumer (a separate package compiling exactly the README's program, output checked)
        run: tools/readme-consumer/run.sh
      - name: Example executable (the README's first ten minutes)
        run: |
          swift build -c release --product diffracto-example
          "$(swift build -c release --show-bin-path)/diffracto-example"
