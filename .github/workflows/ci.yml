# DiffractoKit CI: the gate (`swift test -c release`), the consumer check, the README consumer and the example.
#
# The package's floor is macOS 15 / iOS 18 (since 0.2.0) with tools 6.2; `macos-latest`
# is used with the newest Xcode on the image selected. On 2026-10-15 that was Xcode 26.6, whose compiler (not the local Swift
# 6.4) crashed in its SIL ownership verifier on `catch SomeError.someCase { ... }` clauses in the tests (run 38747583963): the
# tests therefore bind the error (`catch let caught as SomeError`) and match the case in the body.
#
# THE PINS' PYTHON ORACLES ARE NOT RUN HERE. The tests read committed fixtures (Tests/*/Fixtures/*.json, generated by
# tools/*/pins.py against pymatgen 2026.9.24, pymatgen-core 2026.9.23, spglib 2.8.0, NumPy 2.5.4, SciPy 1.18.1 and py4DSTEM
# f050d207's table) and compare the kit with them. Regenerating a fixture needs the gitignored References/ (the pinned
# virtual environment and clones) on the maintainer's machine; the parity dumps against the original applications need those applications checked out
# beside this repository. CI therefore proves "the kit equals the committed pins", not "the pins equal the oracle".
#
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend); `swift test -c release` is the gate.
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Gate (swift test, release)
        run: swift test -c release
      - name: Consumer check (a separate package, the public API only)
        run: tools/consumer-check/run.sh
      - name: README consumer (a separate package compiling exactly the README's program, output checked)
        run: tools/readme-consumer/run.sh
      - name: Example executable (the README's first ten minutes)
        run: |
          swift build -c release --product diffracto-example
          "$(swift build -c release --show-bin-path)/diffracto-example"

  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi
