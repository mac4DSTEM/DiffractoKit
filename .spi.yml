# Swift Package Index: which modules get hosted DocC documentation. DiffractoKit targets Apple platforms today
# (Package.swift: macOS 15, iOS 18, swift-tools 6.2), so the docs build on the Index's macOS SwiftPM builder. The example
# executable has no documentation.
version: 1
builder:
  configs:
    - platform: macos-spm
      documentation_targets: [DiffractoCore, DiffractoScattering, DiffractoGeometry, DiffractoOrientation]
